<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desayunos Escolares - Sec. Foránea 93</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        .bg-tinto { background-color: #6B1C23; }
        .bg-tinto-dark { background-color: #4A1217; }
        .border-tinto { border-color: #6B1C23; }
        .text-tinto { color: #6B1C23; }
    </style>
</head>
<body class="bg-gray-200 text-gray-900 font-sans border-4 border-gray-400 min-h-screen">

    <!-- OVERLAY SPINNER -->
    <div id="loadingOverlay" class="hidden fixed inset-0 bg-black/80 flex flex-col items-center justify-center z-50 text-white p-4">
        <div class="w-16 h-16 border-8 border-gray-300 border-t-[#6B1C23] rounded-full animate-spin mb-4 shadow-2xl"></div>
        <p id="loadingText" class="text-lg font-black tracking-wide text-center">Conectando con el servidor...</p>
    </div>

    <!-- MODAL COBRADOR -->
    <div id="modalCobrador" class="fixed inset-0 bg-black/85 flex items-center justify-center p-4 z-40">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl text-center border-4 border-tinto">
            <img src="logo.jpg" alt="Logo Escuela" class="h-28 mx-auto mb-3 object-contain">
            <h3 class="text-xl font-black text-tinto mb-1">Secundaria Foránea 93</h3>
            <p class="text-xs text-gray-600 mb-4 font-bold uppercase tracking-wider">Gestión de Desayunos</p>
            
            <label class="block text-left text-xs font-black text-gray-700 mb-2">Ingresa tu Nombre (Cobrador/a):</label>
            <input type="text" id="inputNombreCobrador" placeholder="Ej. Profr. Carlos Pérez" class="w-full p-3 border-4 border-gray-400 rounded-xl mb-4 text-center font-bold text-gray-800 focus:outline-none focus:border-tinto text-lg">
            
            <button onclick="guardarNombreCobrador()" class="w-full bg-tinto hover:bg-tinto-dark text-white py-3 rounded-xl font-black text-lg shadow-lg border-2 border-black transition-all active:scale-95">
                INICIAR TURNO
            </button>
        </div>
    </div>

    <!-- PANTALLA PRINCIPAL -->
    <div id="mainScreen" class="min-h-screen flex flex-col">
        <header class="bg-tinto text-white p-3 shadow-xl flex justify-between items-center border-b-4 border-gray-900">
            <div class="flex items-center gap-3">
                <img src="logo.jpg" alt="Logo" class="h-12 w-12 object-contain bg-white rounded-full p-1 border-2 border-gray-300 shadow">
                <div>
                    <h1 class="text-base font-black leading-tight tracking-wide">Sec. Foránea 93</h1>
                    <p class="text-[11px] text-gray-200 font-bold">Desayunos Escolares</p>
                </div>
            </div>
            <button onclick="pedirNombreCobrador()" class="text-right bg-tinto-dark hover:bg-black px-3 py-1.5 rounded-xl border-2 border-gray-300 font-bold shadow-md transition-all">
                <p class="text-[10px] text-gray-300 uppercase">Cobrador:</p>
                <p id="lblCobrador" class="text-xs font-black truncate max-w-[110px] text-white">Ingresar</p>
            </button>
        </header>

        <div class="p-4 grid gap-5 grid-cols-1 max-w-md mx-auto w-full mt-4">
            <button onclick="abrirModuloCobro()" class="bg-tinto hover:bg-tinto-dark text-white p-6 rounded-2xl shadow-xl border-4 border-gray-900 text-xl font-black transition-all active:scale-95 flex items-center justify-center gap-3">
                💰 Cobrar Semana(s)
            </button>
            <button onclick="verOrdenesDia()" class="bg-gray-700 hover:bg-gray-800 text-white p-6 rounded-2xl shadow-xl border-4 border-gray-900 text-xl font-black transition-all active:scale-95 flex items-center justify-center gap-3">
                📋 Órdenes de Hoy
            </button>
            <button onclick="hacerCorteCaja()" class="bg-gray-900 hover:bg-black text-white p-6 rounded-2xl shadow-xl border-4 border-gray-700 text-xl font-black transition-all active:scale-95 flex items-center justify-center gap-3">
                📊 Corte de Caja
            </button>
        </div>
    </div>

    <!-- MÓDULO SELECCIÓN DE ALUMNO -->
    <div id="moduloContainer" class="hidden fixed top-0 left-0 w-full h-full bg-gray-100 p-4 overflow-y-auto z-30">
        <div class="flex justify-between items-center mb-4 pb-2 border-b-4 border-tinto">
            <h2 class="text-2xl font-black text-tinto">💰 Cobrar Desayuno</h2>
            <button onclick="cerrarModulo()" class="bg-gray-800 text-white px-4 py-2 rounded-xl font-black shadow-lg border-2 border-black">✕ Volver</button>
        </div>

        <div class="bg-white p-4 rounded-2xl border-4 border-gray-400 shadow-md mb-4">
            <label class="block text-sm font-black text-gray-800 mb-2">1. Selecciona el Grupo del Alumno:</label>
            <select id="selectGrupo" onchange="filtrarPorGrupo(this.value)" class="w-full p-3 border-4 border-gray-400 rounded-xl text-lg bg-gray-50 font-black text-gray-900 shadow-sm focus:border-tinto focus:outline-none">
                <option value="">-- Elige un grupo --</option>
                <option value="1A">1º A</option>
                <option value="1B">1º B</option>
                <option value="1C">1º C</option>
                <option value="2A">2º A</option>
                <option value="2B">2º B</option>
                <option value="2C">2º C</option>
                <option value="3A">3º A</option>
                <option value="3B">3º B</option>
                <option value="3C">3º C</option>
            </select>
        </div>

        <div id="listaAlumnosGrupo" class="mb-6 space-y-2 max-h-72 overflow-y-auto"></div>

        <div class="border-t-4 border-gray-300 pt-4 text-center">
            <p class="text-xs text-gray-600 mb-2 font-black uppercase">¿El alumno trae su credencial física?</p>
            <button onclick="activarEscanerQR()" class="bg-gray-800 hover:bg-black text-white font-black py-3 px-6 rounded-2xl shadow-xl border-2 border-black transition-all flex items-center justify-center mx-auto gap-2">
                📷 Activar Escáner QR
            </button>
        </div>

        <div id="qrCamaraContainer" class="hidden mt-4 p-4 border-4 border-tinto rounded-2xl bg-gray-900 text-white">
            <div id="reader" class="w-full rounded-xl overflow-hidden"></div>
            <button onclick="desactivarEscanerQR()" class="mt-3 w-full bg-red-700 text-white py-2 rounded-xl font-black shadow-md border border-black">Cerrar Cámara</button>
        </div>
    </div>

    <!-- MODAL ÓRDENES DE HOY -->
    <div id="ordenesContainer" class="hidden fixed top-0 left-0 w-full h-full bg-gray-100 p-4 overflow-y-auto z-40">
        <h2 class="text-2xl font-black mb-4 text-center text-tinto">Desayunos Pagados para Hoy</h2>
        <div id="listaOrdenes" class="mb-4"></div>
        <button onclick="cerrarModal('ordenesContainer')" class="w-full bg-gray-800 text-white p-3 rounded-xl font-black mt-4 shadow-xl border-2 border-black">Cerrar Lista</button>
    </div>

    <!-- MODAL CALENDARIO Y COBRO -->
    <div id="cobroContainer" class="hidden fixed top-0 left-0 w-full h-full bg-white p-4 overflow-y-auto z-40">
        <h2 class="text-2xl font-black mb-1 text-center text-tinto">Seleccionar Días a Pagar</h2>
        <p id="cobroAlumnoNombre" class="text-center font-black text-gray-900 mb-4 bg-gray-100 p-3 rounded-xl border-4 border-gray-300 text-base"></p>
        
        <p class="text-xs font-black text-gray-500 mb-2 uppercase tracking-wide">Toca los días para marcarlos/desmarcarlos:</p>
        <div id="listaFechas" class="grid grid-cols-2 gap-3 mb-6"></div>
        
        <div class="flex gap-2">
            <button onclick="cerrarModal('cobroContainer')" class="w-1/3 bg-gray-600 text-white p-3 rounded-xl font-black border-2 border-black">Cancelar</button>
            <button onclick="procesarCobroSeleccionado()" class="w-2/3 bg-tinto hover:bg-tinto-dark text-white p-3 rounded-xl font-black shadow-xl border-2 border-black">Confirmar Cobro</button>
        </div>
    </div>

    <script>
        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbwy04JiTDX-KzrZOrYLxcoojMIno_Jf3nJidinwMA7qMu3AzTEJra3umravlcNGwxnHew/exec"; 
        
        let html5QrcodeScanner = null;
        let alumnoSeleccionado = ""; 
        let nombreAlumnoSeleccionado = "";
        let nombreCobrador = localStorage.getItem("cobrador_desayunos") || "";

        let baseAlumnosLocal = [];
        const cachePagos = {};

        function mostrarCargando(texto = "Cargando...") {
            document.getElementById("loadingText").innerText = texto;
            document.getElementById("loadingOverlay").classList.remove("hidden");
        }

        function ocultarCargando() {
            document.getElementById("loadingOverlay").classList.add("hidden");
        }

        // FETCH CON REINTENTOS AUTOMÁTICOS DE CONEXIÓN
        async function fetchConReintentos(payload, timeoutMs = 8000, intentosMax = 3) {
            for (let i = 1; i <= intentosMax; i++) {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), timeoutMs);
                try {
                    if (i > 1) mostrarCargando(`Reintentando conexión (${i}/${intentosMax})...`);
                    const response = await fetch(URL_SCRIPT, {
                        method: "POST",
                        body: JSON.stringify(payload),
                        signal: controller.signal
                    });
                    clearTimeout(timer);
                    return await response.json();
                } catch (error) {
                    clearTimeout(timer);
                    if (i === intentosMax) throw error;
                }
            }
        }

        window.addEventListener("DOMContentLoaded", function() {
            if (!nombreCobrador) {
                document.getElementById("modalCobrador").classList.remove("hidden");
            } else {
                document.getElementById("modalCobrador").classList.add("hidden");
                document.getElementById("lblCobrador").innerText = nombreCobrador;
            }
            precargarBaseAlumnos();
        });

        async function precargarBaseAlumnos() {
            try {
                const data = await fetchConReintentos({ accion: "cargar_todos_usuarios" }, 12000, 2);
                if (data.exito) {
                    baseAlumnosLocal = data.usuarios;
                    console.log("✅ Padrón cargado:", baseAlumnosLocal.length);
                }
            } catch (err) {
                console.warn("⚠️ No se pudo precargar lista general.");
            }
        }

        function pedirNombreCobrador() {
            document.getElementById("inputNombreCobrador").value = nombreCobrador;
            document.getElementById("modalCobrador").classList.remove("hidden");
        }

        function guardarNombreCobrador() {
            let val = document.getElementById("inputNombreCobrador").value.trim();
            if (!val) return alert("Ingresa tu nombre para identificarte.");
            nombreCobrador = val;
            localStorage.setItem("cobrador_desayunos", nombreCobrador);
            document.getElementById("lblCobrador").innerText = nombreCobrador;
            document.getElementById("modalCobrador").classList.add("hidden");
        }

        function abrirModuloCobro() {
            if (!nombreCobrador) return pedirNombreCobrador();
            document.getElementById("selectGrupo").value = "";
            document.getElementById("listaAlumnosGrupo").innerHTML = "";
            desactivarEscanerQR();
            document.getElementById("moduloContainer").classList.remove("hidden");
        }

        function cerrarModulo() {
            desactivarEscanerQR();
            document.getElementById("moduloContainer").classList.add("hidden");
        }

        function cerrarModal(id) {
            document.getElementById(id).classList.add("hidden");
        }

        async function filtrarPorGrupo(grupo) {
            let contenedor = document.getElementById("listaAlumnosGrupo");
            if (!grupo) {
                contenedor.innerHTML = "";
                return;
            }

            if (baseAlumnosLocal.length === 0) {
                mostrarCargando("Sincronizando lista...");
                await precargarBaseAlumnos();
                ocultarCargando();
            }

            let filtrados = baseAlumnosLocal.filter(u => u.grupo.toLowerCase() === grupo.toLowerCase());

            if (filtrados.length > 0) {
                renderizarListaAlumnos(filtrados);
            } else {
                contenedor.innerHTML = "<p class='text-red-600 font-black text-center py-4'>No hay alumnos en el grupo " + grupo + ".</p>";
            }
        }

        function renderizarListaAlumnos(lista) {
            let contenedor = document.getElementById("listaAlumnosGrupo");
            let html = "";
            lista.forEach(u => {
                html += `
                <div onclick="seleccionarAlumno('${u.id}', '${u.nombre}')" class="bg-white hover:bg-gray-50 border-4 border-gray-300 p-3 rounded-2xl flex justify-between items-center cursor-pointer shadow-sm active:scale-98 transition-all">
                    <div>
                        <p class="font-black text-gray-900">${u.nombre}</p>
                        <p class="text-xs text-gray-600 font-bold">ID: ${u.id}</p>
                    </div>
                    <span class="bg-tinto text-white text-xs font-black px-3 py-2 rounded-xl shadow border border-black">Seleccionar</span>
                </div>`;
            });
            contenedor.innerHTML = html;
        }

        // SELECCIONAR ALUMNO CON VALIDACIÓN PROTEGIDA DE CONEXIÓN
        async function seleccionarAlumno(id, nombre) {
            alumnoSeleccionado = id;
            nombreAlumnoSeleccionado = nombre;
            desactivarEscanerQR();

            let pagados = [];

            if (cachePagos[id]) {
                pagados = cachePagos[id];
                mostrarCalendarioCobro(id, nombre, pagados);
            } else {
                mostrarCargando("Verificando historial de pagos...");
                try {
                    const data = await fetchConReintentos({ accion: "dias_pagados", id_usuario: id }, 7000, 3);
                    ocultarCargando();
                    
                    if (data && data.exito) {
                        pagados = data.pagados || [];
                        cachePagos[id] = pagados;
                        mostrarCalendarioCobro(id, nombre, pagados);
                    } else {
                        throw new Error("Respuesta inválida del servidor");
                    }
                } catch (e) {
                    ocultarCargando();
                    // BLOQUEO DE SEGURIDAD: No abre el calendario si no se pudo verificar el historial para evitar cobranza doble.
                    alert("⚠️ ERROR DE CONEXIÓN\n\nNo se pudo verificar el historial de pagos del alumno desde el servidor.\n\nPor seguridad, no se abrirá el calendario para evitar cobros duplicados. Revisa tu conexión a internet e intenta de nuevo.");
                }
            }
        }

        function activarEscanerQR() {
            document.getElementById("qrCamaraContainer").classList.remove("hidden");
            if (!html5QrcodeScanner) {
                html5QrcodeScanner = new Html5Qrcode("reader");
            }
            const config = { fps: 10, qrbox: { width: 220, height: 220 } };
            html5QrcodeScanner.start({ facingMode: "environment" }, config, onScanSuccess, (e)=>{} );
        }

        function desactivarEscanerQR() {
            if (html5QrcodeScanner && html5QrcodeScanner.isScanning) {
                html5QrcodeScanner.stop().then(() => {
                    document.getElementById("qrCamaraContainer").classList.add("hidden");
                }).catch(err => console.log(err));
            } else {
                document.getElementById("qrCamaraContainer").classList.add("hidden");
            }
        }

        function onScanSuccess(decodedText) {
            desactivarEscanerQR(); 
            let alumnoEncontrado = baseAlumnosLocal.find(u => u.id.toLowerCase() === decodedText.toLowerCase());
            let nombre = alumnoEncontrado ? alumnoEncontrado.nombre : "";
            seleccionarAlumno(decodedText, nombre);
        }

        // GENERACIÓN RIGUROSA DE FECHAS EN FORMATO YYYY-MM-DD
        function obtenerFechaISO(d) {
            let anio = d.getFullYear();
            let mes = String(d.getMonth() + 1).padStart(2, '0');
            let dia = String(d.getDate()).padStart(2, '0');
            return `${anio}-${mes}-${dia}`;
        }

        function mostrarCalendarioCobro(idUsuario, nombreAlumno, diasPagados = []) {
            document.getElementById("cobroAlumnoNombre").innerText = (nombreAlumno ? nombreAlumno + " | " : "") + "ID: " + idUsuario;
            let contenedorFechas = document.getElementById("listaFechas");
            contenedorFechas.innerHTML = "";
            
            let ahora = new Date();
            let horaActual = ahora.getHours();
            let hoyStr = obtenerFechaISO(ahora);

            let fechas = [];
            let f = new Date();
            
            while(fechas.length < 20) {
                let diaSemana = f.getDay();
                if(diaSemana !== 0 && diaSemana !== 6) { 
                    let iso = obtenerFechaISO(f);
                    let fechaMostrada = f.toLocaleDateString('es-MX', { weekday: 'short', month: 'short', day: 'numeric' });
                    
                    let esHoy = (iso === hoyStr);
                    let bloqueadoPorHora = esHoy && (horaActual >= 10);
                    let yaPagado = diasPagados.includes(iso);

                    fechas.push({ valor: iso, etiqueta: fechaMostrada, esHoy: esHoy, bloqueado: bloqueadoPorHora, yaPagado: yaPagado });
                }
                f.setDate(f.getDate() + 1);
            }

            fechas.forEach(fecha => {
                if (fecha.yaPagado) {
                    contenedorFechas.innerHTML += `
                        <button type="button" disabled 
                            class="w-full p-3 bg-green-100 text-green-800 border-4 border-green-400 rounded-xl font-black text-xs cursor-not-allowed text-center">
                            ${fecha.etiqueta}<br><span class="text-[10px] text-green-700 font-bold">✅ Ya Pagado</span>
                        </button>
                    `;
                } else if (fecha.bloqueado) {
                    contenedorFechas.innerHTML += `
                        <button type="button" disabled 
                            class="w-full p-3 bg-gray-200 text-gray-500 border-4 border-gray-300 rounded-xl font-black text-xs cursor-not-allowed text-center">
                            ${fecha.etiqueta}<br><span class="text-[10px] text-red-600 font-bold">(Cerrado > 10:00 AM)</span>
                        </button>
                    `;
                } else {
                    contenedorFechas.innerHTML += `
                        <button type="button" 
                            onclick="toggleSeleccionFecha(this)" 
                            data-fecha="${fecha.valor}"
                            class="btn-fecha-cobro w-full p-3 bg-gray-100 text-gray-900 border-4 border-gray-300 rounded-xl font-black text-sm shadow-sm transition-all duration-150 active:scale-95">
                            ${fecha.etiqueta} ${fecha.esHoy ? '⭐ (Hoy)' : ''}
                        </button>
                    `;
                }
            });
            document.getElementById("cobroContainer").classList.remove("hidden");
        }

        function toggleSeleccionFecha(btn) {
            btn.classList.toggle('bg-tinto');
            btn.classList.toggle('text-white');
            btn.classList.toggle('border-black');
            btn.classList.toggle('bg-gray-100');
            btn.classList.toggle('text-gray-900');
            btn.classList.toggle('border-gray-300');
            btn.classList.toggle('fecha-seleccionada');
        }

        async function procesarCobroSeleccionado() {
            let botonesSeleccionados = document.querySelectorAll('.fecha-seleccionada');
            let diasSeleccionados = Array.from(botonesSeleccionados).map(btn => btn.getAttribute('data-fecha'));
            
            if(diasSeleccionados.length === 0) return alert("Selecciona al menos un día.");
            
            let totalCobro = diasSeleccionados.length * 30;
            let identificadorAlumno = nombreAlumnoSeleccionado ? `${nombreAlumnoSeleccionado} (${alumnoSeleccionado})` : `ID: ${alumnoSeleccionado}`;
            
            let confirmacion = confirm(`⚠️ CONFIRMAR PAGO\n\nAlumno: ${identificadorAlumno}\nAtendido por: ${nombreCobrador}\nDías: ${diasSeleccionados.length}\nTotal: $${totalCobro}\n\n¿Registrar pago?`);
            
            if (!confirmacion) return;

            cerrarModal('cobroContainer');
            mostrarCargando("Guardando el cobro en el servidor...");
            
            try {
                const data = await fetchConReintentos({
                    accion: "cobrar",
                    id_usuario: alumnoSeleccionado,
                    fechas: diasSeleccionados,
                    cobrador: nombreCobrador
                }, 10000, 3);
                
                ocultarCargando();
                alert(data.exito ? "✅ " + data.mensaje : "❌ " + data.mensaje);
                
                if (data.exito) {
                    if (!cachePagos[alumnoSeleccionado]) cachePagos[alumnoSeleccionado] = [];
                    cachePagos[alumnoSeleccionado].push(...diasSeleccionados);
                    cerrarModulo();
                }
            } catch (e) {
                ocultarCargando();
                alert("❌ Falló el registro del cobro por problemas de conexión. Por favor intenta registrar el pago de nuevo.");
            }
        }

        async function verOrdenesDia() {
            document.getElementById("ordenesContainer").classList.remove("hidden");
            document.getElementById("listaOrdenes").innerHTML = "";
            mostrarCargando("Cargando lista del día...");

            try {
                const data = await fetchConReintentos({ accion: "ordenes_dia" }, 8000, 2);
                ocultarCargando();
                if (data.exito) {
                    let html = `<p class='text-center font-black mb-4 bg-gray-200 p-3 rounded-xl border-2 border-gray-400 text-tinto text-base'>Total pagados hoy: ${data.ordenes.length}</p>`;
                    if (data.ordenes.length === 0) html += "<p class='text-center text-gray-600 font-black py-4'>Nadie ha pagado para hoy.</p>";
                    data.ordenes.forEach(o => {
                        html += `
                        <div class="p-3 mb-2 rounded-xl border-4 bg-green-50 border-green-300 flex justify-between items-center shadow-sm">
                            <div>
                                <p class="font-black text-gray-900">${o.nombre}</p>
                                <p class="text-xs text-gray-600 font-bold">ID: ${o.id} | Grupo: ${o.grupo}</p>
                            </div>
                            <div class="font-black text-green-700">✅ Pagado</div>
                        </div>`;
                    });
                    document.getElementById("listaOrdenes").innerHTML = html;
                } else alert(data.mensaje);
            } catch (e) {
                ocultarCargando();
                document.getElementById("listaOrdenes").innerHTML = "<p class='text-red-600 font-black text-center py-4'>Error de conexión al obtener órdenes.</p>";
            }
        }

        async function hacerCorteCaja() {
            mostrarCargando("Calculando corte...");
            try {
                const data = await fetchConReintentos({ accion: "corte" }, 8000, 2);
                ocultarCargando();
                if (data.exito) alert(`📊 CORTE DE HOY\n\nDinero cobrado hoy: $${data.cobrado}\nDesayunos pagados hoy: ${data.cantidad}`);
                else alert(data.mensaje);
            } catch (e) {
                ocultarCargando();
                alert("Error de conexión al consultar el corte.");
            }
        }
    </script>
</body>
</html>
