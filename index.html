<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desayunos Escolares</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lector QR -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <!-- MENÚ PRINCIPAL -->
    <div id="mainScreen" class="min-h-screen flex flex-col">
        <header class="bg-blue-600 text-white p-4 shadow-md flex justify-center items-center">
            <h1 class="text-xl font-bold">Gestión de Desayunos</h1>
        </header>

        <div class="p-4 grid gap-4 grid-cols-1">
            <button onclick="abrirModulo('entregar')" class="bg-green-500 hover:bg-green-600 text-white p-6 rounded-xl shadow-md text-xl font-bold transition-all">🍏 Entregar Desayuno</button>
            <button onclick="abrirModulo('cobrar')" class="bg-yellow-500 hover:bg-yellow-600 text-white p-6 rounded-xl shadow-md text-xl font-bold transition-all">💰 Cobrar Semana(s)</button>
            <button onclick="verOrdenesDia()" class="bg-indigo-500 hover:bg-indigo-600 text-white p-6 rounded-xl shadow-md text-xl font-bold transition-all">📋 Órdenes de Hoy</button>
            <button onclick="hacerCorteCaja()" class="bg-gray-700 hover:bg-gray-800 text-white p-6 rounded-xl shadow-md text-xl font-bold transition-all">📊 Corte de Caja</button>
        </div>
    </div>

    <!-- MODULO DE SELECCIÓN DE ALUMNO Y QR -->
    <div id="moduloContainer" class="hidden fixed top-0 left-0 w-full h-full bg-white p-4 overflow-y-auto z-40">
        <div class="flex justify-between items-center mb-4 pb-2 border-b">
            <h2 id="moduloTitulo" class="text-2xl font-bold text-blue-600"></h2>
            <button onclick="cerrarModulo()" class="bg-red-500 text-white px-4 py-2 rounded-lg font-bold shadow">✕ Volver</button>
        </div>

        <!-- FILTRO POR GRUPO -->
        <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 shadow-sm mb-4">
            <label class="block text-sm font-bold text-gray-700 mb-2">1. Selecciona el Grupo del Alumno:</label>
            <select id="selectGrupo" onchange="filtrarPorGrupo(this.value)" class="w-full p-3 border border-gray-300 rounded-lg text-lg bg-white font-semibold text-gray-800 shadow-sm focus:ring-2 focus:ring-blue-500">
                <option value="">-- Elige un grupo --</option>
                <option value="1A">1º A</option>
                <option value="1B">1º B</option>
                <option value="1C">1º C</option>
                <option value="2A">2º A</option>
                <option value="2B">2º B</option>
                <option value="2C">2º C</option>
                <option value="3A">3º A</option>
                <option value="3B">3º B</option>
                <option value="3C">3º C</option>
            </select>
        </div>

        <!-- LISTA DE ALUMNOS DEL GRUPO SELECCIONADO -->
        <div id="listaAlumnosGrupo" class="mb-6 space-y-2 max-h-72 overflow-y-auto"></div>

        <!-- OPCIÓN SECUNDARIA: ESCÁNER QR -->
        <div class="border-t pt-4 text-center">
            <p class="text-sm text-gray-500 mb-2 font-medium">¿El alumno trae su credencial física?</p>
            <button onclick="activarEscanerQR()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl shadow-md transition-all flex items-center justify-center mx-auto gap-2">
                📷 Activar Escáner QR
            </button>
        </div>

        <!-- CONTENEDOR DEL LECTOR QR (Oculto por defecto) -->
        <div id="qrCamaraContainer" class="hidden mt-4 p-4 border-2 border-indigo-400 rounded-xl bg-gray-900 text-white">
            <div id="reader" class="w-full rounded overflow-hidden"></div>
            <button onclick="desactivarEscanerQR()" class="mt-3 w-full bg-red-600 text-white py-2 rounded-lg font-bold shadow">Cerrar Cámara</button>
        </div>
    </div>

    <!-- MODAL ÓRDENES DEL DÍA -->
    <div id="ordenesContainer" class="hidden fixed top-0 left-0 w-full h-full bg-white p-4 overflow-y-auto z-50">
        <h2 class="text-2xl font-bold mb-4 text-center text-indigo-600">Desayunos de Hoy</h2>
        <div id="listaOrdenes" class="mb-4"></div>
        <button onclick="cerrarModal('ordenesContainer')" class="w-full bg-red-500 text-white p-3 rounded-lg font-bold mt-4 shadow-lg">Cerrar Lista</button>
    </div>

    <!-- MODAL SELECCIÓN DE DÍAS PARA COBRAR (BOTONES) -->
    <div id="cobroContainer" class="hidden fixed top-0 left-0 w-full h-full bg-white p-4 overflow-y-auto z-50">
        <h2 class="text-2xl font-bold mb-1 text-center text-yellow-600">Seleccionar Días a Pagar</h2>
        <p id="cobroAlumnoNombre" class="text-center font-bold text-gray-700 mb-4 bg-yellow-50 p-2 rounded border border-yellow-200"></p>
        
        <p class="text-xs font-bold text-gray-500 mb-2 uppercase tracking-wide">Toca los días para marcarlos/desmarcarlos:</p>
        <div id="listaFechas" class="grid grid-cols-2 gap-3 mb-6"></div>
        
        <div class="flex gap-2">
            <button onclick="cerrarModal('cobroContainer')" class="w-1/3 bg-gray-500 text-white p-3 rounded-lg font-bold">Cancelar</button>
            <button onclick="procesarCobroSeleccionado()" class="w-2/3 bg-yellow-500 hover:bg-yellow-600 text-white p-3 rounded-lg font-bold shadow-lg">Confirmar Cobro</button>
        </div>
    </div>

    <script>
        // --- CONFIGURACIÓN ---
        // Pega tu URL de Google Apps Script aquí:
        const URL_SCRIPT = "URL_DE_TU_GOOGLE_SCRIPT_AQUI"; 
        
        let accionActual = ""; 
        let html5QrcodeScanner = null;
        let alumnoSeleccionado = ""; 

        function abrirModulo(accion) {
            accionActual = accion;
            document.getElementById("moduloTitulo").innerText = accion === 'entregar' ? "🍏 Entregar Desayuno" : "💰 Cobrar Semana(s)";
            document.getElementById("selectGrupo").value = "";
            document.getElementById("listaAlumnosGrupo").innerHTML = "";
            desactivarEscanerQR();
            document.getElementById("moduloContainer").classList.remove("hidden");
        }

        function cerrarModulo() {
            desactivarEscanerQR();
            document.getElementById("moduloContainer").classList.add("hidden");
        }

        function cerrarModal(id) {
            document.getElementById(id).classList.add("hidden");
        }

        // --- FILTRADO DE ALUMNOS POR GRUPO ---
        function filtrarPorGrupo(grupo) {
            let contenedor = document.getElementById("listaAlumnosGrupo");
            if (!grupo) {
                contenedor.innerHTML = "";
                return;
            }
            
            contenedor.innerHTML = "<p class='text-gray-500 font-bold text-center py-4'>Cargando alumnos de " + grupo + "...</p>";
            
            fetch(URL_SCRIPT, {
                method: "POST",
                body: JSON.stringify({ accion: "buscar_manual", busqueda: grupo })
            })
            .then(res => res.json())
            .then(data => {
                if(data.exito && data.resultados.length > 0) {
                    let html = "";
                    data.resultados.forEach(u => {
                        html += `
                        <div onclick="seleccionarAlumno('${u.id}', '${u.nombre}')" class="bg-blue-50 hover:bg-blue-100 border border-blue-200 p-3 rounded-xl flex justify-between items-center cursor-pointer shadow-sm active:scale-98 transition-all">
                            <div>
                                <p class="font-bold text-gray-800">${u.nombre}</p>
                                <p class="text-xs text-gray-500">ID: ${u.id}</p>
                            </div>
                            <span class="bg-blue-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow">Seleccionar</span>
                        </div>`;
                    });
                    contenedor.innerHTML = html;
                } else {
                    contenedor.innerHTML = "<p class='text-red-500 font-bold text-center py-4'>No se encontraron alumnos en el grupo " + grupo + ".</p>";
                }
            })
            .catch(() => contenedor.innerHTML = "<p class='text-red-500 font-bold text-center py-4'>Error al conectar con la base de datos.</p>");
        }

        function seleccionarAlumno(id, nombre) {
            desactivarEscanerQR();
            procesarUsuario(id, nombre);
        }

        // --- MANEJO DEL ESCÁNER QR DESACTIVADO POR DEFECTO ---
        function activarEscanerQR() {
            document.getElementById("qrCamaraContainer").classList.remove("hidden");
            if (!html5QrcodeScanner) {
                html5QrcodeScanner = new Html5Qrcode("reader");
            }
            const config = { fps: 10, qrbox: { width: 220, height: 220 } };
            html5QrcodeScanner.start({ facingMode: "environment" }, config, onScanSuccess, (e)=>{} );
        }

        function desactivarEscanerQR() {
            if (html5QrcodeScanner && html5QrcodeScanner.isScanning) {
                html5QrcodeScanner.stop().then(() => {
                    document.getElementById("qrCamaraContainer").classList.add("hidden");
                }).catch(err => console.log(err));
            } else {
                document.getElementById("qrCamaraContainer").classList.add("hidden");
            }
        }

        function onScanSuccess(decodedText) {
            desactivarEscanerQR(); 
            procesarUsuario(decodedText, "");
        }

        function procesarUsuario(idUsuario, nombreUsuario) {
            if (accionActual === "entregar") {
                registrarEntrega(idUsuario);
            } else if (accionActual === "cobrar") {
                alumnoSeleccionado = idUsuario;
                mostrarCalendarioCobro(idUsuario, nombreUsuario);
            }
        }

        // --- COBRO CON BOTONES INTERACTIVOS DE FECHAS ---
        function mostrarCalendarioCobro(idUsuario, nombreAlumno) {
            document.getElementById("cobroAlumnoNombre").innerText = (nombreAlumno ? nombreAlumno + " | " : "") + "ID: " + idUsuario;
            let contenedorFechas = document.getElementById("listaFechas");
            contenedorFechas.innerHTML = "";
            
            let fechas = [];
            let f = new Date();
            while(fechas.length < 20) {
                let diaSemana = f.getDay();
                if(diaSemana !== 0 && diaSemana !== 6) { 
                    let iso = f.toISOString().split('T')[0];
                    let fechaMostrada = f.toLocaleDateString('es-MX', { weekday: 'short', month: 'short', day: 'numeric' });
                    fechas.push({ valor: iso, etiqueta: fechaMostrada });
                }
                f.setDate(f.getDate() + 1);
            }

            fechas.forEach(fecha => {
                contenedorFechas.innerHTML += `
                    <button type="button" 
                        onclick="toggleSeleccionFecha(this)" 
                        data-fecha="${fecha.valor}"
                        class="btn-fecha-cobro w-full p-3 bg-gray-100 text-gray-700 border-2 border-gray-200 rounded-xl font-bold text-sm shadow-sm transition-all duration-150 active:scale-95">
                        ${fecha.etiqueta}
                    </button>
                `;
            });
            document.getElementById("cobroContainer").classList.remove("hidden");
        }

        function toggleSeleccionFecha(btn) {
            btn.classList.toggle('bg-yellow-500');
            btn.classList.toggle('text-white');
            btn.classList.toggle('border-yellow-600');
            btn.classList.toggle('bg-gray-100');
            btn.classList.toggle('text-gray-700');
            btn.classList.toggle('border-gray-200');
            btn.classList.toggle('fecha-seleccionada');
        }

        function procesarCobroSeleccionado() {
            let botonesSeleccionados = document.querySelectorAll('.fecha-seleccionada');
            let diasSeleccionados = Array.from(botonesSeleccionados).map(btn => btn.getAttribute('data-fecha'));
            
            if(diasSeleccionados.length === 0) return alert("Debes seleccionar al menos un día pulsando los botones.");
            
            cerrarModal('cobroContainer');
            
            fetch(URL_SCRIPT, {
                method: "POST",
                body: JSON.stringify({
                    accion: "cobrar",
                    id_usuario: alumnoSeleccionado,
                    fechas: diasSeleccionados
                })
            })
            .then(res => res.json())
            .then(data => alert(data.exito ? "✅ " + data.mensaje : "❌ " + data.mensaje))
            .catch(() => alert("Error de red"));
        }

        function registrarEntrega(idUsuario) {
            fetch(URL_SCRIPT, {
                method: "POST",
                body: JSON.stringify({ accion: "entregar", id_usuario: idUsuario })
            })
            .then(res => res.json())
            .then(data => alert(data.exito ? "✅ " + data.mensaje : "❌ " + data.mensaje))
            .catch(() => alert("Error de red"));
        }

        function verOrdenesDia() {
            document.getElementById("ordenesContainer").classList.remove("hidden");
            document.getElementById("listaOrdenes").innerHTML = "<p class='text-center mt-10 font-bold text-gray-500'>Cargando órdenes...</p>";

            fetch(URL_SCRIPT, {
                method: "POST",
                body: JSON.stringify({ accion: "ordenes_dia" })
            })
            .then(res => res.json())
            .then(data => {
                if (data.exito) {
                    let html = `<p class='text-center font-bold mb-4 bg-indigo-100 p-2 rounded-lg text-indigo-800'>Total a preparar hoy: ${data.ordenes.length}</p>`;
                    if (data.ordenes.length === 0) html += "<p class='text-center text-gray-500 font-bold'>Nadie ha pagado para hoy.</p>";
                    data.ordenes.forEach(o => {
                        let ok = o.estado === 'Entregado';
                        html += `
                        <div class="p-3 mb-2 rounded-xl border flex justify-between items-center ${ok ? 'bg-green-100 border-green-300' : 'bg-orange-100 border-orange-300'}">
                            <div>
                                <p class="font-bold text-gray-800">${o.nombre}</p>
                                <p class="text-xs text-gray-600">ID: ${o.id} | Grupo: ${o.grupo}</p>
                            </div>
                            <div class="font-bold ${ok ? 'text-green-700' : 'text-orange-600'}">${ok ? '✅' : '⏳'} ${o.estado}</div>
                        </div>`;
                    });
                    document.getElementById("listaOrdenes").innerHTML = html;
                } else alert(data.mensaje);
            }).catch(() => document.getElementById("listaOrdenes").innerHTML = "<p class='text-red-500 text-center'>Error de red.</p>");
        }

        function hacerCorteCaja() {
            fetch(URL_SCRIPT, {
                method: "POST",
                body: JSON.stringify({ accion: "corte" })
            })
            .then(res => res.json())
            .then(data => {
                if(data.exito) alert(`📊 CORTE DE HOY\n\nDinero cobrado hoy: $${data.cobrado}\nDesayunos entregados hoy: ${data.entregados}`);
                else alert(data.mensaje);
            })
            .catch(() => alert("Error de red"));
        }
    </script>
</body>
</html>
