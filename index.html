<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cobro de Desayunos Escolares</title>
  <!-- Librería de escaneo QR ultra rápida -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --success: #16a34a;
      --danger: #dc2626;
      --bg: #f8fafc;
      --card-bg: #ffffff;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      margin: 0;
      padding: 15px;
      color: #1e293b;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      margin-bottom: 15px;
    }

    h2, h3 { margin-top: 0; color: #0f172a; text-align: center; }

    /* Lector QR Optimizado */
    #reader {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #e2e8f0;
      background: #000;
    }

    /* Buscador manual */
    .search-box {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      box-sizing: border-box;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-success { background: var(--success); color: white; width: 100%; font-size: 16px; padding: 12px; }

    /* Tarjeta de Alumno */
    .user-info {
      background: #eff6ff;
      border-left: 4px solid var(--primary);
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    /* Selector de Días y Semanas */
    .week-title {
      font-size: 13px;
      font-weight: bold;
      color: #64748b;
      margin: 12px 0 6px 0;
      text-transform: uppercase;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }

    .day-chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 4px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #f1f5f9;
      cursor: pointer;
      user-select: none;
      font-size: 12px;
      text-align: center;
    }

    .day-chip .day-name { font-weight: bold; font-size: 11px; }
    .day-chip .day-date { font-size: 10px; color: #64748b; }

    /* Estados de los Días */
    .day-chip.selected {
      background: #dbeafe;
      border-color: var(--primary);
      color: var(--primary);
      font-weight: bold;
    }

    .day-chip.paid {
      background: #dcfce7;
      border-color: var(--success);
      color: var(--success);
      cursor: not-allowed;
      opacity: 0.8;
    }

    .total-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .hidden { display: none !important; }
    
    #status-msg {
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h2>📷 Escáner de Cobro</h2>
    <!-- Lector QR -->
    <div id="reader"></div>
    
    <!-- Buscador Manual -->
    <div class="search-box">
      <input type="text" id="input-search" placeholder="Buscar por Nombre o ID...">
      <button class="btn-primary" onclick="buscarUsuarioManual()">Buscar</button>
    </div>
  </div>

  <!-- Panel de Cobro -->
  <div class="card hidden" id="panel-cobro">
    <h3>Detalle de Cobro</h3>
    
    <div class="user-info">
      <div id="user-name" style="font-weight: bold; font-size: 16px;">-</div>
      <div id="user-detail" style="font-size: 13px; color: #475569;">ID: -</div>
    </div>

    <!-- Selección de Días -->
    <div class="week-title">📅 Esta Semana</div>
    <div class="days-grid" id="grid-semana-actual"></div>

    <div class="week-title">📅 Próxima Semana</div>
    <div class="days-grid" id="grid-semana-siguiente"></div>

    <!-- Resumen de Pago -->
    <div class="total-box">
      <span>Días seleccionados: <span id="cant-dias">0</span></span>
      <span style="font-size: 18px; color: var(--success);" id="total-monto">$0 MXN</span>
    </div>

    <!-- Clave del Gestor -->
    <div style="margin-bottom: 12px;">
      <input type="password" id="pass-gestor" placeholder="Contraseña de Cobro" value="desayunof93">
      <input type="text" id="nombre-gestor" placeholder="Nombre de quien cobra" value="Cajero" style="margin-top: 6px;">
    </div>

    <!-- Botón de Cobro -->
    <button class="btn-success" id="btn-cobrar" onclick="procesarCobro()" disabled style="opacity: 0.5;">
      Selecciona al menos un día
    </button>
  </div>

  <div id="status-msg" class="hidden"></div>
</div>

<script>
  // =========================================================================
  // ⚠️ PEGA AQUÍ LA URL DE TU APLICACIÓN WEB (Termina en /exec)
  // =========================================================================
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwy04JiTDX-KzrZOrYLxcoojMIno_Jf3nJidinwMA7qMu3AzTEJra3umravlcNGwxnHew/exec"; 

  const PRECIO_DIA = 30;
  let usuarioActual = null;
  let fechasSeleccionadas = [];
  let html5QrCode = null;
  let isScanningLocked = false;

  // Conexión API con Google Apps Script desde GitHub Pages
  async function apiCall(datos) {
    if (!WEB_APP_URL || WEB_APP_URL.includes("PEGA_AQUI")) {
      alert("Debes colocar la URL de tu Web App de Google Apps Script en la variable WEB_APP_URL.");
      throw new Error("URL no configurada");
    }
    const resp = await fetch(WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify(datos)
    });
    return await resp.json();
  }

  // ==========================================
  // 1. ESCÁNER QR OPTIMIZADO
  // ==========================================
  function iniciarEscaner() {
    html5QrCode = new Html5Qrcode("reader");
    
    const config = {
      fps: 25,
      qrbox: { width: 220, height: 220 },
      aspectRatio: 1.0,
      videoConstraints: {
        facingMode: "environment",
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    };

    html5QrCode.start(
      { facingMode: "environment" },
      config,
      onScanSuccess
    ).catch(err => {
      console.warn("Error con cámara trasera, intentando frontal:", err);
      html5QrCode.start({ facingMode: "user" }, config, onScanSuccess);
    });
  }

  function onScanSuccess(decodedText) {
    if (isScanningLocked) return;
    
    isScanningLocked = true;
    setTimeout(() => { isScanningLocked = false; }, 1500);

    const idScanned = decodedText.trim();
    cargarUsuarioParaCobro(idScanned);
  }

  // ==========================================
  // 2. BUSCAR Y CARGAR USUARIO
  // ==========================================
  function buscarUsuarioManual() {
    const q = document.getElementById('input-search').value.trim();
    if (q !== "") cargarUsuarioParaCobro(q);
  }

  async function cargarUsuarioParaCobro(query) {
    mostrarMensaje("Cargando usuario...", "#2563eb");
    
    try {
      const res = await apiCall({ action: "buscarUsuario", query: query });
      
      if (res.success && res.usuarios.length > 0) {
        usuarioActual = res.usuarios[0];
        
        const resFechas = await apiCall({ action: "obtenerFechasPagadas", id: usuarioActual.id });
        ocultarMensaje();
        const pagadas = resFechas.fechasPagadas || [];
        mostrarPanelCobro(usuarioActual, pagadas);
      } else {
        mostrarMensaje("❌ Alumno o Usuario no encontrado.", "#dc2626");
      }
    } catch (err) {
      mostrarMensaje("❌ Error al conectar con Google Sheets: " + err.message, "#dc2626");
    }
  }

  // ==========================================
  // 3. MOSTRAR PANEL Y GENERAR SEMANAS
  // ==========================================
  function mostrarPanelCobro(user, pagadas) {
    document.getElementById('user-name').innerText = user.nombre;
    document.getElementById('user-detail').innerText = `ID: ${user.id} | Grado: ${user.grado || '-'}`;
    
    fechasSeleccionadas = [];
    actualizarResumen();

    const hoy = new Date();
    const lunesActual = getLunes(hoy);
    const lunesSiguiente = new Date(lunesActual);
    lunesSiguiente.setDate(lunesSiguiente.getDate() + 7);

    renderGridDias('grid-semana-actual', lunesActual, pagadas);
    renderGridDias('grid-semana-siguiente', lunesSiguiente, pagadas);

    document.getElementById('panel-cobro').classList.remove('hidden');
  }

  function renderGridDias(containerId, lunes, pagadas) {
    const container = document.getElementById(containerId);
    container.innerHTML = "";
    
    const diasNombre = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie'];

    for (let i = 0; i < 5; i++) {
      const d = new Date(lunes);
      d.setDate(d.getDate() + i);
      
      const isoFecha = d.toISOString().split('T')[0];
      const diaNum = d.getDate();
      const estaPagado = pagadas.includes(isoFecha);

      const chip = document.createElement('div');
      chip.className = `day-chip ${estaPagado ? 'paid' : ''}`;
      chip.innerHTML = `
        <span class="day-name">${diasNombre[i]}</span>
        <span class="day-date">${diaNum}</span>
        <span style="font-size:9px;">${estaPagado ? '✔ Pagado' : ''}</span>
      `;

      if (!estaPagado) {
        chip.onclick = () => toggleDia(chip, isoFecha);
      }

      container.appendChild(chip);
    }
  }

  function toggleDia(chipElement, fecha) {
    const index = fechasSeleccionadas.indexOf(fecha);
    if (index > -1) {
      fechasSeleccionadas.splice(index, 1);
      chipElement.classList.remove('selected');
    } else {
      fechasSeleccionadas.push(fecha);
      chipElement.classList.add('selected');
    }
    actualizarResumen();
  }

  function actualizarResumen() {
    const cant = fechasSeleccionadas.length;
    const total = cant * PRECIO_DIA;
    
    document.getElementById('cant-dias').innerText = cant;
    document.getElementById('total-monto').innerText = `$${total} MXN`;

    const btn = document.getElementById('btn-cobrar');
    if (cant > 0) {
      btn.disabled = false;
      btn.style.opacity = "1";
      btn.innerText = `💳 Registrar Cobro (${cant} días - $${total})`;
    } else {
      btn.disabled = true;
      btn.style.opacity = "0.5";
      btn.innerText = "Selecciona al menos un día";
    }
  }

  // ==========================================
  // 4. PROCESAR EL PAGO
  // ==========================================
  async function procesarCobro() {
    if (!usuarioActual || fechasSeleccionadas.length === 0) return;

    const pass = document.getElementById('pass-gestor').value;
    const gestor = document.getElementById('nombre-gestor').value;

    if (!gestor.trim()) {
      alert("Por favor ingresa el nombre del cajero/gestor.");
      return;
    }

    mostrarMensaje("Registrando pago...", "#2563eb");

    try {
      const res = await apiCall({
        action: "registrarPago",
        id: usuarioActual.id,
        fechas: fechasSeleccionadas,
        pass: pass,
        gestor: gestor
      });

      if (res.success) {
        mostrarMensaje(`✅ ${res.message}`, "#16a34a");
        document.getElementById('panel-cobro').classList.add('hidden');
        document.getElementById('input-search').value = "";
      } else {
        mostrarMensaje(`❌ ${res.message}`, "#dc2626");
      }
    } catch (err) {
      mostrarMensaje("❌ Error registrando el pago: " + err.message, "#dc2626");
    }
  }

  // Helpers
  function getLunes(d) {
    const date = new Date(d);
    const day = date.getDay();
    const diff = date.getDate() - day + (day === 0 ? -6 : 1);
    return new Date(date.setDate(diff));
  }

  function mostrarMensaje(txt, color) {
    const el = document.getElementById('status-msg');
    el.innerText = txt;
    el.style.background = color;
    el.style.color = "white";
    el.classList.remove('hidden');
  }

  function ocultarMensaje() {
    document.getElementById('status-msg').classList.add('hidden');
  }

  window.onload = iniciarEscaner;
</script>
</body>
</html>
